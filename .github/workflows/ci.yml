name: CI Pipeline

on:
  push:
    branches: [ "main", "develop", "feature/*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Backend Tests & Database Schema Verification
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: recruitment
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        working-directory: ./BackEnd
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify MySQL Database Schema (db/schema.sql)
        run: |
          mysql -h 127.0.0.1 -P 3306 -u root -proot < BackEnd/db/schema.sql
          echo "CSDL schema.sql thực thi thành công trên MySQL 8.0!"

      - name: Run Unit Tests
        working-directory: ./BackEnd
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: root
          DB_NAME: recruitment
          JWT_SECRET_KEY: test-secret-key-for-ci-pipeline-123456789
        run: |
          python -m unittest discover -s tests -t . -v
