<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Xác thực Email - Hệ thống Tuyển dụng</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body style="background: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%);">

  <header class="site-header">
    <div class="container navbar">
      <a href="index.html" class="brand">
        <div class="brand-icon"><i class="fa-solid fa-briefcase"></i></div>
        <span>Tuyển Dụng & Việc Làm</span>
      </a>
    </div>
  </header>

  <div class="container-sm">
    <div class="card text-center" style="box-shadow: var(--shadow-lg); border-radius: var(--radius-lg); padding: 40px 32px;">
      
      <div id="statusIcon" style="width: 68px; height: 68px; border-radius: 50%; background: var(--primary-light); color: var(--primary); display: inline-flex; align-items: center; justify-content: center; font-size: 2rem; margin-bottom: 20px;">
        <i class="fa-solid fa-spinner fa-spin"></i>
      </div>

      <h1 id="statusTitle" style="font-size: 1.6rem; font-weight: 700; color: var(--text-main); margin-bottom: 12px;">Đang xác thực email...</h1>
      
      <div id="result" class="msg" style="justify-content: center; text-align: center;"></div>

      <div style="margin-top: 28px;">
        <a id="actionBtn" href="login.html" class="btn btn-primary btn-block">
          <i class="fa-solid fa-arrow-right-to-bracket"></i> Đến trang Đăng nhập
        </a>
      </div>

      <div class="text-center mt-3">
        <a href="index.html" style="font-size: 0.85rem; color: var(--text-muted);">
          <i class="fa-solid fa-house"></i> Về trang chủ
        </a>
      </div>

    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/verify-email.js"></script>
</body>
</html>
