<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đăng ký tài khoản - Hệ thống Tuyển dụng</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body style="background: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%);">

  <!-- Header -->
  <header class="site-header">
    <div class="container navbar">
      <a href="index.html" class="brand">
        <div class="brand-icon"><i class="fa-solid fa-briefcase"></i></div>
        <span>Tuyển Dụng & Việc Làm</span>
      </a>
      <div class="nav-actions">
        <span style="font-size: 0.9rem; color: var(--text-muted);">Đã có tài khoản?</span>
        <a href="login.html" class="btn btn-outline btn-sm">Đăng nhập</a>
      </div>
    </div>
  </header>

  <div class="container-sm">
    <div class="card" style="box-shadow: var(--shadow-lg); border-radius: var(--radius-lg); padding: 32px;">
      
      <div class="text-center" style="margin-bottom: 24px;">
        <h1 style="font-size: 1.7rem; font-weight: 700; color: var(--text-main);">Tạo tài khoản mới</h1>
        <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 6px;">Chọn vai trò để bắt đầu trải nghiệm hệ thống</p>
      </div>

      <!-- Chọn vai trò (Role Picker) -->
      <div class="role-picker">
        <div class="role-option selected" id="roleOptionCandidate" data-role="CANDIDATE">
          <div class="role-option-icon"><i class="fa-solid fa-user-graduate"></i></div>
          <div class="role-option-title">Ứng viên</div>
          <div class="role-option-desc">Tôi muốn tìm việc và ứng tuyển</div>
        </div>
        <div class="role-option" id="roleOptionRecruiter" data-role="RECRUITER">
          <div class="role-option-icon"><i class="fa-solid fa-building"></i></div>
          <div class="role-option-title">Nhà tuyển dụng</div>
          <div class="role-option-desc">Tôi muốn đăng tin và tìm ứng viên</div>
        </div>
      </div>

      <div id="msg" class="msg"></div>

      <form id="registerForm">
        <input type="hidden" id="role" name="role" value="CANDIDATE">

        <div class="form-group">
          <label class="form-label" for="full_name" id="nameLabel">Họ và tên của bạn</label>
          <div class="input-icon-wrap">
            <i class="fa-regular fa-user prefix-icon"></i>
            <input id="full_name" name="full_name" type="text" class="form-control" placeholder="Nguyễn Văn A" required>
          </div>
        </div>

        <div id="companyBox" class="form-group hidden">
          <label class="form-label" for="company_name">Tên công ty / Doanh nghiệp <span style="color: var(--danger)">*</span></label>
          <div class="input-icon-wrap">
            <i class="fa-solid fa-building-flag prefix-icon"></i>
            <input id="company_name" name="company_name" type="text" class="form-control" placeholder="Công ty TNHH Công nghệ ABC">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="email">Địa chỉ Email</label>
          <div class="input-icon-wrap">
            <i class="fa-regular fa-envelope prefix-icon"></i>
            <input id="email" name="email" type="email" class="form-control" placeholder="email@example.com" required autocomplete="username">
          </div>
          <div class="form-hint">Mã xác thực tài khoản sẽ được gửi đến email này.</div>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Mật khẩu (tối thiểu 8 ký tự)</label>
          <div class="input-icon-wrap">
            <i class="fa-solid fa-lock prefix-icon"></i>
            <input id="password" name="password" type="password" minlength="8" class="form-control" placeholder="••••••••" required autocomplete="new-password">
            <button type="button" class="password-toggle" id="togglePassword">
              <i class="fa-regular fa-eye" id="eyeIcon"></i>
            </button>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="confirm_password">Xác nhận mật khẩu</label>
          <div class="input-icon-wrap">
            <i class="fa-solid fa-lock-check prefix-icon"></i>
            <input id="confirm_password" name="confirm_password" type="password" minlength="8" class="form-control" placeholder="••••••••" required autocomplete="new-password">
          </div>
        </div>

        <div style="margin-bottom: 20px;">
          <label style="display: flex; align-items: flex-start; gap: 8px; font-weight: 400; font-size: 0.85rem; cursor: pointer;">
            <input type="checkbox" id="termsCheck" required style="width: auto; margin-top: 3px;">
            <span>Tôi đồng ý với <a href="#" onclick="alert('Điều khoản dịch vụ và chính sách bảo mật của Hệ thống Tuyển dụng.'); return false;">Điều khoản dịch vụ</a> và <a href="#" onclick="alert('Chính sách bảo mật thông tin người dùng.'); return false;">Chính sách bảo mật</a>.</span>
          </label>
        </div>

        <button type="submit" id="submitBtn" class="btn btn-primary btn-block btn-lg">
          <i class="fa-solid fa-user-plus"></i> Đăng ký ngay
        </button>
      </form>

      <div class="link mt-4 text-center" style="font-size: 0.9rem;">
        Đã có tài khoản? <a href="login.html" style="font-weight: 600;">Đăng nhập</a>
      </div>

    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/register.js"></script>
</body>
</html>
