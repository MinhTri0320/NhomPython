<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đăng ký</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>Đăng ký tài khoản</h1>
      <form id="registerForm">
        <label for="role">Bạn là</label>
        <select id="role" name="role">
          <option value="CANDIDATE">Ứng viên (tìm việc)</option>
          <option value="RECRUITER">Nhà tuyển dụng</option>
        </select>
        <label for="full_name">Họ và tên</label>
        <input id="full_name" name="full_name" required>
        <div id="companyBox" class="hidden">
          <label for="company_name">Tên công ty</label>
          <input id="company_name" name="company_name">
        </div>
        <label for="email">Email</label>
        <input id="email" name="email" type="email" required autocomplete="username">
        <label for="password">Mật khẩu (tối thiểu 8 ký tự)</label>
        <input id="password" name="password" type="password" minlength="8" required autocomplete="new-password">
        <button type="submit">Đăng ký</button>
        <div id="msg" class="msg"></div>
      </form>
      <div class="link">Đã có tài khoản? <a href="login.html">Đăng nhập</a></div>
    </div>
  </div>
  <script src="../js/api.js"></script>
  <script src="../js/register.js"></script>
</body>
</html>
