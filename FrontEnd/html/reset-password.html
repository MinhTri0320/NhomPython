<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đặt lại mật khẩu</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>Đặt lại mật khẩu</h1>
      <form id="resetForm">
        <label for="new_password">Mật khẩu mới (tối thiểu 8 ký tự)</label>
        <input id="new_password" name="new_password" type="password" minlength="8" required autocomplete="new-password">
        <label for="confirm_password">Nhập lại mật khẩu mới</label>
        <input id="confirm_password" name="confirm_password" type="password" minlength="8" required autocomplete="new-password">
        <button type="submit">Đổi mật khẩu</button>
        <div id="msg" class="msg"></div>
      </form>
      <div class="link"><a href="login.html">Quay lại đăng nhập</a></div>
    </div>
  </div>
  <script src="../js/api.js"></script>
  <script src="../js/reset-password.js"></script>
</body>
</html>
