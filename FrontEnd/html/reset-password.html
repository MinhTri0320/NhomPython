<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đặt lại mật khẩu - Hệ thống Tuyển dụng</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body style="background: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%);">

  <header class="site-header">
    <div class="container navbar">
      <a href="index.html" class="brand">
        <div class="brand-icon"><i class="fa-solid fa-briefcase"></i></div>
        <span>Tuyển Dụng & Việc Làm</span>
      </a>
      <div class="nav-actions">
        <a href="login.html" class="btn btn-outline btn-sm">Quay lại Đăng nhập</a>
      </div>
    </div>
  </header>

  <div class="container-sm">
    <div class="card" style="box-shadow: var(--shadow-lg); border-radius: var(--radius-lg); padding: 32px;">
      
      <div class="text-center" style="margin-bottom: 24px;">
        <div style="width: 56px; height: 56px; border-radius: 50%; background: var(--success-bg); color: var(--success); display: inline-flex; align-items: center; justify-content: center; font-size: 1.5rem; margin-bottom: 12px;">
          <i class="fa-solid fa-shield-check"></i>
        </div>
        <h1 style="font-size: 1.6rem; font-weight: 700; color: var(--text-main);">Thiết lập mật khẩu mới</h1>
        <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 6px;">
          Vui lòng nhập mật khẩu mới bảo mật có ít nhất 8 ký tự.
        </p>
      </div>

      <div id="msg" class="msg"></div>

      <form id="resetForm">
        <div class="form-group">
          <label class="form-label" for="new_password">Mật khẩu mới</label>
          <div class="input-icon-wrap">
            <i class="fa-solid fa-lock prefix-icon"></i>
            <input id="new_password" name="new_password" type="password" minlength="8" class="form-control" placeholder="••••••••" required autocomplete="new-password">
            <button type="button" class="password-toggle" id="togglePassword">
              <i class="fa-regular fa-eye" id="eyeIcon"></i>
            </button>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="confirm_password">Xác nhận lại mật khẩu mới</label>
          <div class="input-icon-wrap">
            <i class="fa-solid fa-lock-check prefix-icon"></i>
            <input id="confirm_password" name="confirm_password" type="password" minlength="8" class="form-control" placeholder="••••••••" required autocomplete="new-password">
          </div>
        </div>

        <button type="submit" id="submitBtn" class="btn btn-primary btn-block btn-lg">
          <i class="fa-solid fa-check"></i> Cập nhật mật khẩu mới
        </button>
      </form>

      <div class="link mt-4 text-center" style="font-size: 0.9rem;">
        Quay lại <a href="login.html" style="font-weight: 600;">Đăng nhập</a>
      </div>

    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/reset-password.js"></script>
</body>
</html>
